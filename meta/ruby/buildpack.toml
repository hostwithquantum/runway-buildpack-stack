api = "0.7"

[buildpack]
  description = "A language family buildpack for building Ruby apps"
  homepage = "https://www.runway.horse/docs/recipes/deploy-ruby/"
  id = "runway-buildpacks/ruby"
  keywords = ["ruby"]
  name = "Buildpack for Ruby"
  version = "0.47.86"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/ruby/blob/main/LICENSE"

[metadata]
  include-files = ["buildpack.toml"]

