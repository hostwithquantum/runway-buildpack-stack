name: reminder

on:
  workflow_dispatch:
  release:
    types: [published]
  issues:
    types: [closed]
  schedule:
    - cron: '30 8 * * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.RUNWAY_CI_BOT_APP_ID }}
          private-key: ${{ secrets.RUNWAY_CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            runway-buildpack-stack
          permission-contents: read
          permission-issues: write
      - name: Notify release
        uses: nearform-actions/github-action-notify-release@v2.1.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}