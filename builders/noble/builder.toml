description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.148"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.88"
  version = "3.1.88"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.97"
  version = "4.13.97"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.98"
  version = "11.15.98"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.148"
  version = "18.12.148"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.80"
  version = "9.3.80"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.87"
  version = "2.19.87"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.5"
  version = "5.15.5"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.74"
  version = "2.30.74"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.89"
  version = "0.47.89"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.14.2"
  version = "4.14.2"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.81"
  version = "0.1.81"

[lifecycle]
  version = "0.21.26"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.89"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.88"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.97"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.74"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.87"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.81"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.14.2"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.98"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.148"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.80"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.5"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
