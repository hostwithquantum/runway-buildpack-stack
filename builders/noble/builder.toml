description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.139"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.84"
  version = "3.1.84"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.94"
  version = "4.13.94"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.93"
  version = "11.15.93"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.143"
  version = "18.12.143"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.77"
  version = "9.3.77"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.84"
  version = "2.19.84"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.3"
  version = "5.15.3"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.72"
  version = "2.30.72"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.86"
  version = "0.47.86"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.14.1"
  version = "4.14.1"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.78"
  version = "0.1.78"

[lifecycle]
  version = "0.21.23"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.86"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.84"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.94"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.72"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.84"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.78"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.14.1"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.93"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.143"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.77"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.3"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
