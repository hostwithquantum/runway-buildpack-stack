    version = "2.30.63"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.72"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.69"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.9.1"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.83"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.131"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.68"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.6"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
