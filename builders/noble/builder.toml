description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.129"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.79"
  version = "3.1.79"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.89"
  version = "4.13.89"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.86"
  version = "11.15.86"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.136"
  version = "18.12.136"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.72"
  version = "9.3.72"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.78"
  version = "2.19.78"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.14.0"
  version = "5.14.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.67"
  version = "2.30.67"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.81"
  version = "0.47.81"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.10.1"
  version = "4.10.1"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.73"
  version = "0.1.73"

[lifecycle]
  version = "0.21.19"

[[order]]

  [[order.group]]
