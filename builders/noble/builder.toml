[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.84"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.62"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.71"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.68"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.8.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.81"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.129"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.67"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.6"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

