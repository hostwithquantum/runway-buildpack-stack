[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.77"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.87"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.65"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.76"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.71"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.10.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.85"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.134"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.70"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.7"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

