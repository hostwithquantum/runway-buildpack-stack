    version = "0.47.81"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.79"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.89"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.67"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.78"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.73"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.10.1"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.86"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.136"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.72"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.14.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

