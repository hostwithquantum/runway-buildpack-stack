[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.74"
  version = "0.47.74"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.8.0"
  version = "4.8.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.68"
  version = "0.1.68"

[lifecycle]
  version = "0.21.15"

[[order]]

  [[order.group]]
