[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.83"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.93"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.71"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.82"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.76"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.13.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.92"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.142"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.76"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.2"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

