description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.113"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.73"
  version = "3.1.73"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.84"
  version = "4.13.84"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.81"
  version = "11.15.81"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.129"
  version = "18.12.129"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.67"
  version = "9.3.67"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.71"
  version = "2.19.71"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.6"
  version = "5.13.6"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.62"
