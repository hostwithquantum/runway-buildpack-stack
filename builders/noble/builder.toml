description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.117"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.75"
  version = "3.1.75"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.85"
  version = "4.13.85"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.83"
  version = "11.15.83"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.131"
  version = "18.12.131"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.68"
  version = "9.3.68"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.72"
  version = "2.19.72"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.6"
  version = "5.13.6"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.63"
  version = "2.30.63"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.77"
  version = "0.47.77"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.9.1"
  version = "4.9.1"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.69"
  version = "0.1.69"

[lifecycle]
  version = "0.21.17"

[[order]]

