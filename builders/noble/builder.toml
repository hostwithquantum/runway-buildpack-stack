description = "Ubuntu 24.04 Noble Numbat base image with buildpacks"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.137"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.83"
  version = "3.1.83"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.93"
  version = "4.13.93"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.92"
  version = "11.15.92"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.142"
  version = "18.12.142"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.76"
  version = "9.3.76"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.82"
  version = "2.19.82"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.2"
  version = "5.15.2"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.71"
  version = "2.30.71"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.85"
  version = "0.47.85"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.13.0"
  version = "4.13.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.76"
  version = "0.1.76"

[lifecycle]
  version = "0.21.21"

[[order]]

  [[order.group]]
