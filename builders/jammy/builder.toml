description = "Ubuntu 22.04 Jammy Jellyfish full image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/build-jammy-full:0.1.211"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.78"
  version = "3.1.78"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.88"
  version = "4.13.88"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.85"
  version = "11.15.85"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.135"
  version = "18.12.135"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.71"
  version = "9.3.71"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.77"
  version = "2.19.77"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.7"
  version = "5.13.7"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.66"
  version = "2.30.66"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.80"
  version = "0.47.80"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.10.0"
  version = "4.10.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.72"
  version = "0.1.72"

[lifecycle]
  version = "0.21.18"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.80"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.78"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.88"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.66"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.77"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.72"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.10.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.85"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.135"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.71"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.7"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
    image = "r.planetary-quantum.com/runway-public/jammy/run:latest"

[stack]
