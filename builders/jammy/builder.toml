description = "Ubuntu 22.04 Jammy Jellyfish full image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/build-jammy-full:0.1.235"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.86"
  version = "3.1.86"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.95"
  version = "4.13.95"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.95"
  version = "11.15.95"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.145"
  version = "18.12.145"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.78"
  version = "9.3.78"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.85"
  version = "2.19.85"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.4"
  version = "5.15.4"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.73"
  version = "2.30.73"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.87"
  version = "0.47.87"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.14.1"
  version = "4.14.1"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.79"
  version = "0.1.79"

[lifecycle]
  version = "0.21.23"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.87"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.86"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.95"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.73"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.85"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.79"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.14.1"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.95"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.145"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.78"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.4"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
    image = "r.planetary-quantum.com/runway-public/jammy/run:latest"

[stack]
  id = "io.buildpacks.stacks.jammy"
