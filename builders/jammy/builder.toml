description = "Ubuntu 22.04 Jammy Jellyfish full image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/build-jammy-full:0.1.203"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.74"
  version = "3.1.74"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.84"
  version = "4.13.84"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.82"
  version = "11.15.82"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.130"
  version = "18.12.130"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.67"
  version = "9.3.67"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.71"
  version = "2.19.71"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.6"
  version = "5.13.6"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.62"
  version = "2.30.62"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.76"
  version = "0.47.76"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.9.0"
  version = "4.9.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.68"
  version = "0.1.68"

[lifecycle]
  version = "0.21.16"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.76"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.74"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.84"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.62"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.71"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.68"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.9.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.82"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.130"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.67"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.6"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
    image = "r.planetary-quantum.com/runway-public/jammy/run:latest"

[stack]
