description = "Ubuntu 22.04 Jammy Jellyfish full image with buildpacks for Apache HTTPD, Go, Java, Java Native Image, .NET, NGINX, Node.js, PHP, Procfile, Python, and Ruby"

[build]
  image = "docker.io/paketobuildpacks/build-jammy-full:0.1.214"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/dotnet-core:3.1.80"
  version = "3.1.80"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/go:4.13.90"
  version = "4.13.90"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java-native-image:11.15.87"
  version = "11.15.87"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/java:18.12.137"
  version = "18.12.137"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/nodejs:9.3.73"
  version = "9.3.73"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/php:2.19.79"
  version = "2.19.79"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.14.0"
  version = "5.14.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/python:2.30.68"
  version = "2.30.68"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/ruby:0.47.82"
  version = "0.47.82"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/web-servers:4.11.0"
  version = "4.11.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/deno:0.6.0"
  version = "0.6.0"

[[buildpacks]]
  uri = "docker://r.planetary-quantum.com/buildpacks/runway:0.1.73"
  version = "0.1.73"

[lifecycle]
  version = "0.21.19"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/ruby"
    version = "0.47.82"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/dotnet-core"
    version = "3.1.80"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/go"
    version = "4.13.90"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/python"
    version = "2.30.68"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/php"
    version = "2.19.79"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/runway"
    version = "0.1.73"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/web-servers"
    version = "4.11.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java-native-image"
    version = "11.15.87"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/java"
    version = "18.12.137"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/nodejs"
    version = "9.3.73"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.14.0"

[[order]]

  [[order.group]]
    id = "runway-buildpacks/deno"
    version = "0.6.0"

[run]

  [[run.images]]
    image = "r.planetary-quantum.com/runway-public/jammy/run:latest"

[stack]
  id = "io.buildpacks.stacks.jammy"
